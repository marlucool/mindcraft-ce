name: CornBotVL migration tests

on:
  push:
    branches:
      - ai/cornbotvl-ce-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regressions:
    name: Focused navigation, physics and model regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify collectblock patch against the clean published package
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          npm install --prefix "$temp_dir" --ignore-scripts --no-save mineflayer-collectblock@1.6.0
          echo "=== Published CollectBlock.js context ==="
          nl -ba "$temp_dir/node_modules/mineflayer-collectblock/lib/CollectBlock.js" | sed -n '20,85p;185,285p'
          echo "=== Patch dry-run ==="
          cd "$temp_dir"
          git apply --check --verbose "$GITHUB_WORKSPACE/patches/mineflayer-collectblock+1.6.0.patch"

      - name: Install locked dependencies and apply patches
        run: npm ci

      - name: Validate live integration harness syntax
        run: node --check tests/integration/collect_live_test.mjs

      - name: Run focused regression tests
        run: node --test tests/action_manager_stop.test.js tests/world_null_blocks.test.js tests/collect_block_interrupt.test.js tests/collectblock_plugin_cancel.test.js tests/player_physics.test.js tests/physics_vine_climbables.test.js tests/pathfinder_water_exit.test.js tests/pathfinder_goto_unhandled.test.js tests/pathfinder_lava_avoidance.test.js tests/pathfinder_heap.test.js tests/pathfinder_composite_goals.test.js tests/pathfinder_waterlogged.test.js tests/pathfinder_goal_look_at.test.js tests/pathfinder_vine_climbables.test.js tests/pathfinder_door_openable.test.js tests/pathfinder_bamboo.test.js tests/pathfinder_diagonal_corners.test.js tests/goto_path_search.test.js tests/door_types.test.js tests/move_away.test.js tests/pathfinder_patch_guards.test.js tests/gpt_qwen_compat.test.js
